<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dubbed Video Result</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg p-6 text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">🎉 Dubbing Complete!</h1>
    <p class="text-gray-600 mb-6">Here’s your dubbed video. You can watch or download it below:</p>
    
    <video controls class="w-full mb-4 rounded">
      <source src="{{ url_for('static', filename='output/' + filename) }}" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <a href="{{ url_for('static', filename='output/' + filename) }}" download class="inline-block bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white px-6 py-2 rounded-lg text-lg font-medium">
      Download Dubbed Video
    </a>
  </div>
</body>
</html>
